name: Build CrewFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name=crewflow .

      - name: Add contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.READ_CONTACTS"/>'

          if permission not in s:
              pos = s.find('>')
              if pos != -1:
                  s = s[:pos+1] + '\n    ' + permission + s[pos+1:]

          p.write_text(s)
          PY

      - name: Set CrewFlow app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '<application',
              '<application android:label="CrewFlow"',
              1
          )

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build CrewFlow APK
        run: flutter build apk --release

      - name: Upload CrewFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
