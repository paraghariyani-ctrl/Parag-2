name: Build CrewFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Set Android compile SDK 36
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Add Android contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()

              permission = '<uses-permission android:name="android.permission.READ_CONTACTS"/>'

              if permission not in s:
                  s = s.replace(
                      '<manifest',
                      '<manifest',
                      1
                  )

                  pos = s.find('>')

                  if pos != -1:
                      s = s[:pos + 1] + '\n    ' + permission + s[pos + 1:]

                  p.write_text(s)
          PY

      - name: Set CrewFlow app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/src/main/AndroidManifest.xml"),
              Path("android/app/src/main/res/values/strings.xml")
          ]

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text()
              s = s.replace(
                  'android:label="Parag-2"',
                  'android:label="CrewFlow"'
              )
              s = s.replace(
                  'name="app_name">Parag-2<',
                  'name="app_name">CrewFlow<'
              )

              p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze CrewFlow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build CrewFlow APK
        run: flutter build apk --release

      - name: Upload CrewFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "===================================="
          echo "       CREWFLOW APK BUILD DONE"
          echo "===================================="
          ls -lh build/app/outputs/flutter-apk/
