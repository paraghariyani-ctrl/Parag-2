name: Build CrewFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Create Android platform
        run: |
          flutter create --platforms=android .

      - name: Set Android compile SDK 36
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' android/app/build.gradle.kts
          fi

      - name: Add contacts permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()

              permission = '<uses-permission android:name="android.permission.READ_CONTACTS"/>'

              if permission not in s:
                  pos = s.find('>')
                  if pos != -1:
                      s = s[:pos+1] + '\n    ' + permission + s[pos+1:]

              p.write_text(s)
          PY

      - name: Set CrewFlow app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()
              s = s.replace('android:label="phf"', 'android:label="CrewFlow"')
              s = s.replace('android:label="${applicationName}"', 'android:label="CrewFlow"')
              p.write_text(s)
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Analyze app
        run: |
          flutter analyze lib/main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build CrewFlow APK
        run: |
          flutter build apk --release

      - name: Upload CrewFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
