name: Build PHF Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform
  run: flutter create --project-name phf --platforms=android --org com.paraghariyani .

      - name: Add contacts permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              'android.permission.READ_CONTACTS',
              'android.permission.WRITE_CONTACTS'
          ]

          for perm in permissions:
              line = f'    <uses-permission android:name="{perm}"/>\n'
              if perm not in s:
                  s = s.replace(marker, marker + '\n' + line)

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHF-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
