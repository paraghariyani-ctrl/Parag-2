name: Build PHF Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name phf --org com.paraghariyani .

      - name: Add contacts permission
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perm='    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n'
          if 'android.permission.READ_CONTACTS' not in s:
              s=s.replace(marker, marker+'\n'+perm)
          open(p,'w').write(s)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PHF-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
