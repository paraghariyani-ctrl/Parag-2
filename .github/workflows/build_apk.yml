name: Build PHF Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --project-name phf --org com.paraghariyani --platforms=android .

      - name: Add contacts permission
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perm = '    <uses-permission android:name="android.permission.READ_CONTACTS" />\n'
          if "android.permission.READ_CONTACTS" not in s:
              s = s.replace(marker, marker + "\n" + perm)
              p.write_text(s)
          PY2

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/main.dart || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHF-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
