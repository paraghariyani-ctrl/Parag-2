name: Build CrewFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name=phf .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib/main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build CrewFlow APK
        run: flutter build apk --release

      - name: Upload CrewFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
